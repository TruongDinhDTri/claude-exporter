<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Exporter</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #fff;
      padding: 16px;
    }
    
    .header {
      text-align: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    
    .header h1 {
      font-size: 16px;
      background: linear-gradient(90deg, #f093fb, #f5576c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .header p {
      font-size: 11px;
      color: #888;
      margin-top: 4px;
    }
    
    .option-group {
      margin-bottom: 12px;
    }
    
    .option-group label {
      display: block;
      font-size: 11px;
      color: #aaa;
      margin-bottom: 6px;
    }
    
    .radio-group {
      display: flex;
      gap: 6px;
    }
    
    .radio-option {
      flex: 1;
    }
    
    .radio-option input { display: none; }
    
    .radio-option span {
      display: block;
      padding: 8px;
      background: rgba(255,255,255,0.1);
      border-radius: 6px;
      text-align: center;
      font-size: 12px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.2s;
    }
    
    .radio-option input:checked + span {
      background: rgba(245, 87, 108, 0.2);
      border-color: #f5576c;
    }
    
    .radio-option span:hover {
      background: rgba(255,255,255,0.15);
    }
    
    .checkbox-option {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
      background: rgba(255,255,255,0.05);
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
    }
    
    .checkbox-option input {
      width: 16px;
      height: 16px;
      accent-color: #f5576c;
    }
    
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 8px;
      transition: all 0.2s;
    }
    
    .btn-primary {
      background: linear-gradient(90deg, #f093fb, #f5576c);
      color: #fff;
    }
    
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 15px rgba(245, 87, 108, 0.4);
    }
    
    .btn-secondary {
      background: rgba(255,255,255,0.1);
      color: #fff;
    }
    
    .btn-secondary:hover {
      background: rgba(255,255,255,0.15);
    }
    
    .status {
      text-align: center;
      font-size: 12px;
      color: #888;
      margin-top: 8px;
      min-height: 18px;
    }
    
    .status.success { color: #4ade80; }
    .status.error { color: #f87171; }
    
    .footer {
      text-align: center;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,0.1);
      font-size: 10px;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🔥 Claude Exporter</h1>
    <p>Export conversations for AI agents</p>
  </div>
  
  <div class="option-group">
    <label>📄 Format</label>
    <div class="radio-group">
      <label class="radio-option">
        <input type="radio" name="format" value="md" checked>
        <span>Markdown</span>
      </label>
      <label class="radio-option">
        <input type="radio" name="format" value="txt">
        <span>Text</span>
      </label>
      <label class="radio-option">
        <input type="radio" name="format" value="json">
        <span>JSON</span>
      </label>
    </div>
  </div>
  
  <div class="option-group">
    <label class="checkbox-option">
      <input type="checkbox" id="includeTimestamp" checked>
      <span>Include date in filename</span>
    </label>
  </div>
  
  <div class="option-group">
    <label class="checkbox-option">
      <input type="checkbox" id="includeMetadata" checked>
      <span>Include metadata header</span>
    </label>
  </div>
  
  <button class="btn btn-primary" id="exportBtn">📥 Export & Download</button>
  <button class="btn btn-secondary" id="copyBtn">📋 Copy to Clipboard</button>
  
  <div class="status" id="status"></div>
  
  <div class="footer">
    Made for Wiganz 💛 Neriah & Ruach-El
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
